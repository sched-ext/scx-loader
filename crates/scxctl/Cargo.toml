[[bin]]
name = "scxctl"

[package]
name = "scxctl"
version = "1.1.3"
edition = "2024"
description = "A cli dbus client for scx_loader"
authors = ["Joe Maples <joe@maples.dev>"]
repository = "https://github.com/sched-ext/scx-loader"
readme = "README.md"
keywords = ["linux", "scx", "scx_scheds", "scx_loader", "sched_ext"]
categories = ["command-line-utilities"]
license = "GPL-2.0-only"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
shell-words = "1.1"
colored = "3.1.1"
zbus = "5.19.0"
scx_loader = { path = "../scx_loader", version="1.1.3" }

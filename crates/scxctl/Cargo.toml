[[bin]]
name = "scxctl"

[package]
name = "scxctl"
version = "1.2.0"
edition = "2024"
rust-version.workspace = true
description = "A cli dbus client for scx_loader"
authors = ["Joe Maples <joe@maples.dev>"]
repository = "https://github.com/sched-ext/scx-loader"
readme = "README.md"
keywords = ["linux", "scx", "scx_scheds", "scx_loader", "sched_ext"]
categories = ["command-line-utilities"]
license = "GPL-2.0-only"

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
shell-words = "1.1"
colored = "3.1.1"
zbus = { version = "6.5.0", features = ["tokio"], default-features = false }
scx_loader = { path = "../scx_loader", version="1.2.0" }

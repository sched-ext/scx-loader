# This field specifies the scheduler that will be started automatically when scx_loader starts (e.g., on boot).
#default_sched = "scx_cosmos"

# This field specifies the mode which will be used when scx_loader starts (e.g., on boot).
#default_mode = "Auto"

# This "structure" allows configuring flags for each scheduler mode of particular scx scheduler
#[scheds.'scheduler']
#auto_mode = []
#gaming_mode = []
#lowlatency_mode = []
#powersave_mode = []
#server_mode = []

# Set to true to allow schedulers that aren't built in. Each one needs a
# [scheds.'scheduler'] section with the absolute path of its binary, see
# configuration.md.
#allow_custom_scheds = false
#[scheds.scx_mysched]
#path = "/usr/local/bin/scx_mysched"
